<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Root &amp; Register</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%233E63DD%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%23FFFFFF%22 font-family=%22serif%22%3E%26%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#3E63DD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="R&amp;R">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --sunk:#EEF0F6; --ink:#15171C; --muted:#626A7A; --line:#E3E6EE;
  --ko:#E5484D; --ko-soft:#FFEDED; --en:#3E63DD; --en-soft:#EDF2FE; --on-accent:#FFFFFF;
  --ok:#2B9A66; --warn:#E89F00; --bad:#E5484D;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --display:"Bricolage Grotesque","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --serif:var(--display);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1115; --surface:#171A21; --sunk:#1F232C; --ink:#ECEEF3; --muted:#9AA1B2; --line:#2A2F3A;
    --ko:#FF6B6F; --ko-soft:#3A1F22; --en:#7B9BFF; --en-soft:#1C2440; --on-accent:#0F1115;
    --ok:#4CC38A; --warn:#F5B83D; --bad:#FF6B6F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1115; --surface:#171A21; --sunk:#1F232C; --ink:#ECEEF3; --muted:#9AA1B2; --line:#2A2F3A;
  --ko:#FF6B6F; --ko-soft:#3A1F22; --en:#7B9BFF; --en-soft:#1C2440; --on-accent:#0F1115;
  --ok:#4CC38A; --warn:#F5B83D; --bad:#FF6B6F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:880px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:28px 16px}
.brand h1{margin:0;font:800 30px/1.1 var(--display);letter-spacing:-.03em;text-wrap:balance}
.brand h1 .amp{color:var(--ko)}
.home-link{color:inherit;text-decoration:none;border-radius:6px}
.home-link:hover{opacity:.8}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.me img{width:26px;height:26px;border-radius:50%}
.bell-wrap{position:relative}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.bell .tab-badge{position:absolute;top:-4px;right:-4px}
.notif{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;color:var(--ink);font-size:14px}
.notif h3{margin:0;font:700 15px var(--sans)}
.notif .sec{display:grid;gap:6px}
.notif .sec>p.sub{margin:0}
.nrow{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.nrow.static{cursor:default}
.nrow b{font-weight:650}
.nrow .note{font-size:12px}
.push-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.notif-head{display:flex;align-items:center;justify-content:space-between}
.notif-close{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
/* 좁은 화면: 벨이 왼쪽으로 내려가서 오른쪽 기준 패널이 화면 밖으로 나간다 → 화면 안에 고정 */
@media (max-width:640px){
  .notif{position:fixed;left:12px;right:12px;width:auto;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px))}
}
.stats{display:flex;flex-wrap:wrap;gap:8px;font:500 12px/1.4 var(--sans);color:var(--muted);padding-bottom:6px}
.stats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.stats b{color:var(--en);font-weight:700;font-variant-numeric:tabular-nums}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;margin-bottom:14px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);font:600 14px var(--sans);padding:8px 15px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
nav.tabs button[aria-selected="true"]{background:var(--en);color:var(--on-accent);box-shadow:0 4px 12px color-mix(in srgb,var(--en) 30%,transparent)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line);color:var(--ink)}
/* 임시 메뉴(이름 정하기): 투표가 끝나면 SHOW_NAMING=false 로 숨긴다 */
nav.tabs .tab-temp{color:var(--ko);background:var(--ko-soft);border:1px dashed color-mix(in srgb,var(--ko) 55%,transparent)}
nav.tabs .tab-temp::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ko);margin-right:7px;vertical-align:1px}
nav.tabs .tab-temp:hover:not([aria-selected="true"]){color:var(--ko);border-color:var(--ko)}
nav.tabs .tab-temp[aria-selected="true"]{background:var(--ko);border-color:var(--ko);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--ko) 30%,transparent)}
nav.tabs .tab-temp[aria-selected="true"]::before{background:#fff}
.tab-sep{flex:0 0 1px;align-self:stretch;background:var(--line);margin:6px 4px}
/* 건의함: 공부 메뉴가 아니라 앱에 대한 소통 창구라서 오른쪽 끝에 초록 계열로 구분한다 */
nav.tabs .tab-meta{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--ok);background:var(--surface);border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line))}
nav.tabs .tab-meta:hover:not([aria-selected="true"]){color:var(--ok);border-color:var(--ok)}
nav.tabs .tab-meta[aria-selected="true"]{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--ok) 30%,transparent)}
.tab-badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ok);color:#fff;font:700 11px/18px var(--sans);text-align:center}
nav.tabs .tab-meta[aria-selected="true"] .tab-badge{background:#fff;color:var(--ok)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--en);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--en);color:var(--on-accent);border-color:var(--en)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.panel{display:grid;gap:14px}
.note{font-size:13px;color:var(--muted);margin:0}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--sunk);font-size:13px}
.chip{display:inline-block;font:600 11px/1 var(--sans);letter-spacing:.01em;padding:5px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ko{background:var(--ko-soft);color:var(--ko)}
.chip.en{background:var(--en-soft);color:var(--en)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink)}
textarea{min-height:84px;resize:vertical;line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
details.add{background:var(--surface);border:1px dashed color-mix(in srgb,var(--en) 35%,var(--line));border-radius:var(--r)}
details.add>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;list-style:none}
details.add>summary::-webkit-details-marker{display:none}
details.add>summary::before{content:"+ ";color:var(--ko)}
details.add[open]>summary::before{content:"– "}
details.add form{display:grid;gap:10px;padding:0 16px 16px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.ko-word{font-family:var(--serif)}

/* review */
.rv-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--en);color:var(--on-accent)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 22px;display:grid;gap:16px;min-height:280px;align-content:start}
.flash .word{font-family:var(--display);font-size:clamp(30px,7vw,44px);line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.flash .word.en{font-family:var(--sans);font-weight:600;color:var(--en)}
.flash .word.ko{font-family:var(--serif);color:var(--ko)}
.flash .back{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.exs{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:ex}
.exs li{display:grid;gap:1px;padding-left:26px;position:relative;counter-increment:ex}
.exs li::before{content:counter(ex);position:absolute;left:0;top:2px;font:500 11px/18px var(--mono);width:18px;text-align:center;border-radius:50%;background:var(--sunk);color:var(--muted)}
.exs .s{font-size:15px}
.exs .s mark{background:none;color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--ko);text-underline-offset:3px}
.exs .t{font-size:13px;color:var(--muted)}
.exs.small .s{font-size:14px}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flash .meaning{font-size:18px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:grid;gap:2px}
.grade button small{font:400 11px var(--mono);color:var(--muted)}
.grade .g-again{color:var(--bad)} .grade .g-hard{color:var(--warn)} .grade .g-good{color:var(--ok)}
.reveal{width:100%;padding:14px;border-radius:12px;border:0;background:var(--en-soft);cursor:pointer;font-weight:700;color:var(--en);transition:filter .15s}
.reveal:hover{filter:brightness(.97)}
.boxes{display:flex;gap:6px;font:12px var(--mono);color:var(--muted);flex-wrap:wrap}
.boxes span b{color:var(--ink);font-weight:500}

/* glossary */
.filters{display:grid;gap:8px}
.filters .sel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.terms{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.term{display:grid;gap:4px;padding:12px 16px;border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.term .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.term .w{font:700 20px/1.3 var(--display);letter-spacing:-.01em}
.term .w.ko{font-family:var(--serif);font-weight:700}
.term .pair{color:var(--muted);font-size:14px}
.term .ex{font-size:14px;color:var(--muted);margin:0;font-style:italic}
.term .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* sessions */
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
details.sess>summary{cursor:pointer;padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;list-style:none}
details.sess>summary::-webkit-details-marker{display:none}
.sno{font:500 12px var(--mono);color:var(--ko);letter-spacing:.06em}
.stitle{font-weight:600}
.sdate{font:12px var(--mono);color:var(--muted)}
.sbody{padding:0 16px 16px;display:grid;gap:14px}
.src{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px 14px;margin:0;font-size:15px}
.sub{font:600 12px var(--sans);color:var(--muted);letter-spacing:.04em;margin:0 0 6px}
.vers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ver{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.ver p{margin:0;white-space:pre-wrap}
.who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.who img{width:18px;height:18px;border-radius:50%}

/* taglines */
.tl{display:grid;gap:10px}
.tl .t{font:700 22px/1.3 var(--sans);letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.tl .brief{font-size:13px;color:var(--muted);margin:0}
.cmts{display:grid;gap:8px;border-left:2px solid var(--line);padding-left:12px}
.cmt{font-size:14px}
.cmt .who{margin-bottom:2px}
.cmt p{margin:0;white-space:pre-wrap}
.cmt-form{display:flex;gap:8px}
.cmt-form input{flex:1;min-width:0}
.social{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.social .cmts,.social .cmt-form{flex-basis:100%}
.star{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:2px 4px;color:var(--muted)}
.star.on{color:var(--warn)}
.cmt .link{margin-top:2px}
.daily{background:linear-gradient(160deg,var(--en-soft),var(--surface) 55%);border:1px solid var(--line);border-radius:22px;padding:32px 26px;display:grid;gap:20px;box-shadow:var(--shadow)}
.dday{margin:0;font:500 12px var(--mono);color:var(--ko);letter-spacing:.06em}
.dsent{margin:0;font:650 clamp(26px,5.5vw,38px)/1.25 var(--display);letter-spacing:-.02em;color:var(--ink);text-wrap:pretty;overflow-wrap:anywhere}
.dexp{margin:0;font-size:15px;line-height:1.7}
.daily .back{gap:14px}
.daily .meaning{font-size:19px;font-weight:600}
.dwords{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dwords{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.dwords dt{font-weight:600;color:var(--en)}
.dwords dd{margin:0}
.past{display:grid;gap:10px;padding:0 16px 16px}
.past .row{display:flex;gap:10px;align-items:baseline}
.past .row p{margin:0;flex:1;font-size:14px}
.drill{display:grid;gap:12px}
.drill .ko{margin:0;font:700 20px/1.5 var(--sans);letter-spacing:-.01em}
.drill .ctx{margin:0;font-size:12px;color:var(--muted)}
.drill .status{display:flex;flex-wrap:wrap;gap:6px}
.chip.done{background:var(--en-soft);color:var(--en)}
.chip.lv-쉬움{background:color-mix(in srgb,var(--ok) 16%,transparent);color:color-mix(in srgb,var(--ok) 80%,var(--ink))}
.chip.lv-보통{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 65%,var(--ink))}
.chip.lv-실전{background:var(--ko-soft);color:var(--ko)}
.model{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.fb{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fb.done{display:grid;gap:6px;background:var(--en-soft);border-radius:10px;padding:12px 14px}
.fb-body{white-space:pre-wrap;font-size:14px;line-height:1.65}
.mistakes{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.mk-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.mk-wrong{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.mk-better{font-weight:650;color:var(--en)}
.chip.bad{background:var(--ko-soft);color:var(--ko)}
.model .best{margin:0;font:650 19px/1.45 var(--display);color:var(--en);letter-spacing:-.01em}
.model ul{margin:0;padding-left:18px;font-size:14px}
.req{display:grid;gap:10px}
.req h3{margin:0;font:700 18px/1.4 var(--sans);letter-spacing:-.01em}
.req .body{margin:0;white-space:pre-wrap;font-size:15px}
.req .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.st-new{background:var(--en-soft);color:var(--en)}
.st-reviewing,.st-planned{background:var(--sunk);color:var(--ink)}
.st-in_progress{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 65%,var(--ink))}
.st-done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st-declined{background:var(--sunk);color:var(--muted)}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.guide>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.guide>summary::-webkit-details-marker{display:none}
.guide>summary::after{content:"펼치기";font-size:12px;font-weight:500;color:var(--muted)}
.guide[open]>summary::after{content:"접기"}
.guide .gbody{padding:0 18px 18px;display:grid;gap:14px;font-size:14px}
.guide p{margin:0}
.guide ol{margin:0;padding-left:20px;display:grid;gap:8px}
.guide .sts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:0}
.guide .sts dd{margin:0;color:var(--muted)}
.guide .tip{background:var(--sunk);border-radius:10px;padding:10px 12px}
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.nc{display:grid;gap:8px;align-content:start}
.nc .nm{margin:0;font:750 24px/1.2 var(--display);letter-spacing:-.02em}
.nc .gl{margin:0;font-size:13px;color:var(--en);font-weight:600}
.nc .why{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.nc .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.vote[aria-pressed="true"]{background:var(--ko-soft);border-color:var(--ko);color:var(--ko)}
.nc.both{border-color:var(--ko);box-shadow:0 0 0 3px var(--ko-soft),var(--shadow)}
.results{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.rrow .bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.rrow .bar i{display:block;height:100%;background:var(--ko);border-radius:999px}
.rrow b{font-family:var(--display);font-size:15px}
.brief-card{display:grid;gap:12px}
.brief-card h3{margin:0;font:750 20px/1.3 var(--display);letter-spacing:-.01em}
.brief-card .bspec{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.brief-card .bspec dt{color:var(--muted);font-size:12px;font-weight:600;padding-top:2px}
.brief-card .bspec dd{margin:0}
.brief-card .rules{background:var(--ko-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px}
.copies{display:grid;gap:8px}
.copy{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.copy .t{margin:0;font:650 18px/1.4 var(--display);letter-spacing:-.01em}
.copy.mine{background:var(--en-soft);border-color:transparent}
details.add .brief-card form.cmt-form{display:flex;padding:0;gap:8px}
.ver.saved{background:var(--en-soft);border-color:transparent}
.ver-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ver-head .f{font-size:12px;color:var(--muted);font-weight:500}
.saved-tag{color:var(--ok);font-weight:700;font-size:12px}
.prow{border-radius:12px}
.prow.open{background:var(--sunk);padding-bottom:12px}
.ptoggle{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;color:inherit;font:inherit}
.ptoggle:hover{background:var(--sunk)}
.ptoggle .ps{flex:1 1 240px;font-size:14px}
.pback{padding:4px 12px 0;display:grid;gap:10px}
.cfm{border:0;border-radius:18px;padding:22px 22px 18px;width:min(380px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.cfm::backdrop{background:rgba(10,12,16,.45)}
.cfm-title{margin:0 0 6px;font:700 17px/1.45 var(--sans);overflow-wrap:anywhere}
.cfm-what{margin:0 0 6px;font-weight:600;overflow-wrap:anywhere}
.cfm .note{margin:0 0 18px}
.cfm-actions{display:flex;justify-content:flex-end;gap:8px}
.cfm-ok{background:var(--bad);border-color:var(--bad);color:#fff}
.del-link{color:var(--bad)!important}
.cnote{border-left:3px solid var(--en);background:var(--en-soft);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px}
.cnote b{display:block;font-size:12px;color:var(--en);margin-bottom:2px}
.login{width:100%;max-width:400px;margin:40px auto 0;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 24px;display:grid;gap:16px}
.login h2{margin:0;font:700 24px var(--display);letter-spacing:-.02em}
.login .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
.login .seg button{padding:10px;font-size:14px;font-weight:500}
.login .note{margin:-6px 0 0}
.login input[type=email],.login input[type=password]{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px 12px;font-size:16px;color:var(--ink)}
.login input:focus{border-color:var(--en);outline:none;box-shadow:0 0 0 3px var(--en-soft)}
.login .actions{display:grid;gap:10px;justify-items:center;margin-top:4px}
.login .actions .btn.primary{width:100%;padding:12px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.flash{transition:border-color .2s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><a href="/" class="home-link" id="home-link" title="처음 화면(오늘의 문장)으로">Root <span class="amp">&amp;</span> Register</a></h1>
      <p>뿌리와 결 · 통번역사와 카피라이터의 어원·격 공동 노트</p>
    </div>
    <div class="me" id="me"></div>
  </header>
  <div class="stats" id="stats"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="names" class="tab-temp" title="투표 기간에만 보이는 임시 메뉴예요">이름 정하기</button>
    <span class="tab-sep" aria-hidden="true"></span>
    <button role="tab" data-tab="daily">오늘의 문장</button>
    <button role="tab" data-tab="drills">번역 연습</button>
    <button role="tab" data-tab="sessions">교차번역</button>
    <button role="tab" data-tab="review">오늘의 복습</button>
    <button role="tab" data-tab="terms">용어집</button>
    <button role="tab" data-tab="taglines">영어 카피 연습</button>
    <button role="tab" data-tab="requests" class="tab-meta" title="앱을 이렇게 바꿔 주세요: 개선 요청 게시판">건의함<span class="tab-badge" id="req-badge" hidden></span></button>
  </nav>
  <main id="panel" class="panel" aria-live="polite"></main>
  <dialog id="cfm" class="cfm" aria-labelledby="cfm-title">
    <p id="cfm-title" class="cfm-title"></p>
    <p id="cfm-what" class="cfm-what"></p>
    <p id="cfm-body" class="note"></p>
    <div class="cfm-actions"><button type="button" class="btn" id="cfm-cancel">취소</button><button type="button" class="btn cfm-ok" id="cfm-ok">삭제</button></div>
  </dialog>
</div>

<script>
(function(){
"use strict";
const DOMAINS=["일반","마케팅·브랜드","비즈니스·IR","시사·테크","공문·행정"];
const REGISTERS=["구어","문어","전문"];
const LEVELS=["쉬움","보통","실전"];
const INTERVAL={1:1,2:2,3:4,4:8,5:16};
const TABS=["daily","drills","sessions","review","terms","taglines","requests","names"];
// 이름 정하기는 투표 기간에만 쓰는 임시 메뉴. 투표가 끝나면 false 로 바꾸면 탭이 사라진다(데이터는 남는다).
const SHOW_NAMING=true;
if(!SHOW_NAMING){TABS.splice(TABS.indexOf("names"),1);document.querySelector('#tabs [data-tab="names"]')?.remove();document.querySelector('#tabs .tab-sep')?.remove()}
const KINDS=["기능 추가","수정·버그","콘텐츠","디자인","기타"];
const STATUS={new:"새 건의",reviewing:"검토 중",planned:"예정",in_progress:"작업 중",done:"완료",declined:"보류"};
const OPEN_ST=["new","reviewing","planned","in_progress"];
const VAPID_PUBLIC="BLINzXyS2JloJ9rFebqtBe_VSPGSTaVQaCb8JhSWYlA7Z0E635MdQ-hQjqRNXzFzds4tIiS_nEhrlyHiDxRqFA8"; // 웹 푸시 공개 키(비공개 키는 DB private 스키마)
const DIRS=[["KR→EN","한→영"],["EN→KR","영→한"]];
const langOf=dir=>dir==="EN→KR"?"ko":"en";  // 번역문(내 답·추천 표현)의 언어
const TOPICS=[["marketing","마케팅·광고"],["business","비즈니스·이메일"],["daily","일상 회화"],["travel","여행 표현"]];

const S={
  sb:null,uid:null,canWrite:true,dbState:"loading",sent:null,
  terms:[],sessions:[],taglines:[],comments:[],favs:new Set(),daily:null,dailyPast:[],dailyOpen:false,dailyErr:"",
  favOnly:{terms:false,sessions:false,taglines:false,requests:false},
  drills:[],drillAns:[],drillModels:{},drillStatus:[],drillTopic:"marketing",drillDir:"KR→EN",sessModels:{},feedback:[],mistakes:[],fbQueue:[],fbBusy:new Set(),isAdmin:false,notifOpen:false,pushState:"unknown",sessLevel:"all",drillFilter:"all",requests:[],reqFilter:"open",reqEdit:null,editing:new Set(),sessStatus:[],pastFilter:"all",pastLimit:20,briefs:[],copyStatus:[],names_c:[],nameVotes:[],cmtOpen:new Set(),
  review:{exists:false,items:{}},
  tab:"daily",revealed:false,reviewLang:"all",seen:{},
  f:{q:"",lang:"all",reg:"all",dom:"all"},
  names:{},open:new Set(),confirm:null,dirty:new Map(),pending:false,msg:"",shown:new Set(),showAll:false
};
// 주소 경로(/drills 등)로 탭을 고른다. 예전 #drills 링크도 받아 준다.
const pathTab=()=>{const p=location.pathname.replace(/^\/+|\/+$/g,"");return TABS.includes(p)?p:(p===""?"daily":null)};
const tabUrl=t=>t==="daily"?"/":"/"+t;
{const h=location.hash.slice(1),p=pathTab();S.tab=TABS.includes(h)?h:(p||"daily")}

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const isKo=s=>/[ㄱ-힝一-鿿]/.test(s||"");
function exs(t){
  const a=Array.isArray(t.examples)&&t.examples.length?t.examples:(t.example?[t.example]:[]);
  return a.map(x=>typeof x==="string"?{s:x,t:""}:{s:String(x&&x.s||""),t:String(x&&x.t||"")}).filter(x=>x.s);
}
function exList(t,cls,noT){
  const a=exs(t);if(!a.length)return "";
  const w=String(t.word||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const stem=t.lang==="ko"?w.replace(/하다$|다$/,""):w.split(" ")[0];
  const re=stem.length>=2?new RegExp("("+stem+"[\\w가-힣]*)","i"):null;
  return '<ol class="exs'+(cls?" "+cls:"")+'">'+a.map(x=>{let h=esc(x.s);if(re)h=h.replace(re,"<mark>$1</mark>");return '<li><span class="s">'+h+'</span>'+(x.t&&!noT?'<span class="t">'+esc(x.t)+'</span>':"")+'</li>'}).join("")+'</ol>';
}

/* ---------- names ---------- */
function whoHTML(id){
  if(!id)return '<span class="who">예시</span>';
  const p=S.names[id];
  const nm=id===S.uid?"나":(p&&p.name)||id.split("@")[0];
  const av=p&&p.avatarUrl?'<img alt="" src="'+esc(p.avatarUrl)+'">':"";
  return '<span class="who">'+av+esc(nm)+'</span>';
}
function resolveNames(){}

/* ---------- review logic ---------- */
function rec(id){return (S.review.items||{})[id]||null}
function dueTerms(){
  const t=today();
  return S.terms.filter(x=>{
    if(S.reviewLang!=="all"&&x.lang!==S.reviewLang)return false;
    const r=rec(x.id);return !r||!r.due||r.due<=t;
  }).sort((a,b)=>(S.seen[a.id]||0)-(S.seen[b.id]||0)||((rec(a.id)?1:0)-(rec(b.id)?1:0))||(a.createdAt||0)-(b.createdAt||0));
}
async function grade(id,g){
  if(!S.sb||!S.uid)return;
  const r=rec(id)||{box:0};
  let box=r.box||0,due;
  if(g==="again"){box=1;due=today()}
  else if(g==="hard"){box=Math.max(1,box);due=addDays(1)}
  else {box=Math.min(5,box+1);due=addDays(INTERVAL[box])}
  S.seen[id]=Date.now();S.revealed=false;
  const entry={box,due,last:today()};
  S.review.items={...S.review.items,[id]:entry};
  render();
  try{
    const {error}=await S.sb.from("reviews").upsert({author:S.uid,term_id:id,box,due,last:today()});
    if(error)throw error;
  }catch(e){flash("복습 기록을 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.")}
}

/* ---------- render ---------- */
function flash(m){S.msg=m;render();setTimeout(()=>{if(S.msg===m){S.msg="";render()}},4000)}
function renderStats(){
  const due=S.terms.length?dueTerms().length:0;
  const ready=S.dbState==="ready";$("#stats").hidden=!ready;$("#tabs").hidden=!ready;
  $("#stats").innerHTML=
    '<span>오늘 복습 <b>'+due+'</b></span><span>용어 <b>'+S.terms.length+'</b></span><span>번역 연습 <b>'+S.drillStatus.filter(x=>x.author===S.uid).length+'</b>/'+S.drills.length+'</span><span>즐겨찾기 <b>'+S.favs.size+'</b></span><span>건의 <b>'+S.requests.filter(r=>OPEN_ST.includes(r.status)).length+'</b></span><span>교차번역 <b>'+new Set(S.sessions.map(x=>x.no)).size+'</b>/12회</span><span>카피 <b>'+S.taglines.filter(t=>t.addedBy===S.uid).length+'</b></span>';
  for(const b of document.querySelectorAll("#tabs button"))b.setAttribute("aria-selected",String(b.dataset.tab===S.tab));
  renderBell();
  {const n=S.requests.filter(r=>r.status==="new").length,bd=$("#req-badge");if(bd){bd.textContent=n;bd.hidden=!n;bd.title="새 건의 "+n+"개"}}
}
function render(){
  const ae=document.activeElement;
  if(ae&&$("#panel").contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=="button"){S.pending=true;renderStats();return}
  S.pending=false;
  renderStats();
  let h="";
  if(S.msg)h+='<div class="banner" role="status">'+esc(S.msg)+'</div>';
  if(S.authMode==="newpw")h+=vLogin();
  else if(S.dbState==="loading")h+='<div class="empty">노트를 불러오는 중…</div>';
  else if(S.dbState==="off")h+='<div class="banner">설정(config.js)을 불러오지 못했어요. 관리자에게 알려 주세요.</div>';
  else if(S.dbState==="login")h+=vLogin();
  else if(S.dbState==="notmember")h+='<div class="login"><h2>등록되지 않은 계정이에요</h2><p class="note">'+esc(S.uid)+' 계정은 멤버 목록에 없어요. 함께 공부하는 사람에게 멤버로 추가해 달라고 요청하세요.</p><div class="row-actions"><button class="btn" data-action="logout">다른 이메일로 로그인</button></div></div>';
  else{
    if(!S.canWrite)h+='<div class="banner">읽기 전용으로 보고 있어요. 기록하려면 소유자에게 편집 권한을 요청하세요.</div>';
    h+=({daily:vDaily,drills:vDrills,review:vReview,terms:vTerms,sessions:vSessions,taglines:vTaglines,requests:vRequests,names:vNames})[S.tab]();
  }
  $("#panel").innerHTML=h;
  if(S.dbState==="ready")markSeenVisible();
  for(const [id,v] of S.dirty){const el=document.getElementById(id);if(el)el.value=v}
  resolveNames();
}
function opt(list,sel,all){return (all?'<option value="all">'+all+'</option>':"")+list.map(v=>'<option'+(v===sel?" selected":"")+'>'+esc(v)+'</option>').join("")}
function langChip(l){return l==="ko"?'<span class="chip ko">한국어</span>':'<span class="chip en">ENGLISH</span>'}

function vReview(){
  if(!S.terms.length)return '<div class="empty">아직 용어가 없어요. 용어집에서 첫 용어를 추가해 보세요.</div>';
  const q=dueTerms();
  const counts=[0,0,0,0,0,0];for(const t of S.terms){const r=rec(t.id);counts[r?r.box||0:0]++}
  let h='<div class="rv-top"><div class="seg" role="group" aria-label="언어">'+
    [["all","전체"],["en","영어"],["ko","한국어"]].map(([k,l])=>'<button data-action="rlang" data-v="'+k+'" aria-pressed="'+(S.reviewLang===k)+'">'+l+'</button>').join("")+
    '</div><div class="boxes"><span>새 용어 <b>'+counts[0]+'</b></span>'+[1,2,3,4,5].map(i=>'<span>'+i+'단계 <b>'+counts[i]+'</b></span>').join("")+'</div></div>';
  if(!S.uid)return h+'<div class="banner">복습 기록은 사람마다 따로 저장돼요. 로그인한 상태에서 열어야 복습할 수 있어요.</div>';
  if(!q.length)return h+'<div class="empty">오늘 복습할 용어를 모두 끝냈어요. 다음 복습은 내일 이후에 돌아와요.</div>';
  const t=q[0],r=rec(t.id);
  h+='<article class="flash"><div class="chips">'+langChip(t.lang)+'<span class="chip">'+esc(t.register||"")+'</span><span class="chip">'+esc(t.domain||"")+'</span>'+(r?'<span class="chip">'+r.box+'단계</span>':'<span class="chip">새 용어</span>')+'<span class="chip">남은 카드 '+q.length+'</span>'+starBtn("term",t.id)+'</div>'+
    '<p class="word '+(t.lang==="ko"?"ko":"en")+'">'+esc(t.word)+'</p>';
  if(!S.revealed)h+='<button class="reveal" data-action="reveal">뜻 보기</button>';
  else{
    h+='<div class="back"><p class="meaning">'+esc(t.meaning)+'</p><dl class="kv">'+
      (t.pair?'<dt>대응 표현</dt><dd>'+esc(t.pair)+'</dd>':"")+
      '</dl>'+exBlock(t)+'</div><div class="grade">'+
      '<button class="g-again" data-action="grade" data-g="again" data-id="'+esc(t.id)+'">다시<small>오늘 한 번 더</small></button>'+
      '<button class="g-hard" data-action="grade" data-g="hard" data-id="'+esc(t.id)+'">애매<small>내일</small></button>'+
      '<button class="g-good" data-action="grade" data-g="good" data-id="'+esc(t.id)+'">알았음<small>'+INTERVAL[Math.min(5,(r&&r.box||0)+1)]+'일 뒤</small></button></div>';
  }
  return h+'</article>';
}

function exBlock(t){
  const n=exs(t).length;
  return '<p class="sub" style="margin:0">예문'+(n?" "+n+"개":"")+'</p>'+(n?exList(t):'<p class="note">예문이 아직 없어요.</p>');
}
function vTerms(){
  const f=S.f,q=f.q.trim().toLowerCase();
  const list=S.terms.filter(t=>(!S.favOnly.terms||isFav("term",t.id))&&(f.lang==="all"||t.lang===f.lang)&&(f.reg==="all"||t.register===f.reg)&&(f.dom==="all"||t.domain===f.dom)&&
    (!q||[t.word,t.meaning,t.pair].concat(exs(t).map(x=>x.s)).some(v=>String(v||"").toLowerCase().includes(q)))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let h=addTermForm();
  h+='<div class="filters"><input type="search" id="f-q" placeholder="단어, 뜻, 예문 검색" value="'+esc(f.q)+'" aria-label="검색">'+
    '<div class="sel"><select id="f-lang" aria-label="언어"><option value="all">모든 언어</option><option value="en"'+(f.lang==="en"?" selected":"")+'>영어</option><option value="ko"'+(f.lang==="ko"?" selected":"")+'>한국어</option></select>'+
    '<select id="f-reg" aria-label="격">'+opt(REGISTERS,f.reg,"모든 격")+'</select><select id="f-dom" aria-label="분야">'+opt(DOMAINS,f.dom,"모든 분야")+'</select></div></div>';
  h+='<div class="rv-top"><p class="note">'+list.length+'개 표시 중 · 영어 용어는 단어와 예문만 먼저 보여요</p><button class="link" data-action="show-all">'+(S.showAll?"영어 뜻 모두 숨기기":"영어 뜻 모두 보기")+'</button>'+favOnlyBtn("terms")+'</div>';
  if(!list.length)return h+'<div class="empty">조건에 맞는 용어가 없어요.</div>';
  return h+'<div class="terms">'+list.map(t=>{
    const hide=t.lang==="en"&&!S.showAll&&!S.shown.has(t.id);
    const tog=t.lang==="en"?'<button class="link" data-action="toggle-term" data-id="'+esc(t.id)+'">'+(hide?"뜻 보기":"뜻 숨기기")+'</button>':"";
    const pairOk=t.pair&&(!hide||!isKo(t.pair));
    return '<div class="term"><div class="hd"><span class="w '+(t.lang==="ko"?"ko":"")+'">'+esc(t.word)+'</span>'+(pairOk?'<span class="pair">← '+esc(t.pair)+'</span>':"")+'</div>'+

// 제출칸 공통: 저장 전에는 입력칸, 저장 후에는 잠긴 읽기 전용 + 수정 버튼(수정 중에는 저장·취소).
// o = {key, label, value, at, ta(입력 id), action, attrs, lang, ph, submitLabel, savedWord, hint}
function lockBox(o){
  const editing=!o.value||S.editing.has(o.key),lang=o.lang?' lang="'+o.lang+'"':'';
  if(editing)return '<div class="ver"><label class="f">'+o.label+(o.value?' <span class="note">(수정 중)</span>':'')+
    '<textarea id="'+esc(o.ta)+'"'+lang+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>'+esc(o.value||"")+'</textarea></label>'+
    '<div class="row-actions"><button class="btn small primary" data-action="'+o.action+'" '+o.attrs+'>'+(o.value?"저장":(o.submitLabel||"저장"))+'</button>'+
    (o.value?'<button class="link" data-action="lk-cancel" data-k="'+esc(o.key)+'" data-ta="'+esc(o.ta)+'">취소</button>':'<span class="note">'+(o.hint||"저장하면 잠겨요. 고치려면 수정을 눌러요.")+'</span>')+'</div></div>';
  const when=o.at?new Date(o.at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
  return '<div class="ver saved"><div class="ver-head"><span class="f" style="margin:0">'+o.label+'</span><span class="saved-tag">✓ '+(o.savedWord||"저장됨")+(when?' · '+esc(when):'')+'</span></div>'+
    '<p'+lang+'>'+esc(o.value)+'</p><div class="row-actions"><button class="btn small" data-action="lk-edit" data-k="'+esc(o.key)+'" data-ta="'+esc(o.ta)+'">수정</button></div></div>';
}
// 원문마다 누가 번역을 저장했는지 (본문 없이)
function sessChips(s){
  const members=Object.keys(S.names).filter(m=>m!==S.uid);
  return '<div class="status">'+members.map(m=>{const done=S.sessStatus.some(x=>x.session_id===s.id&&x.author===m);
    return '<span class="chip'+(done?" done":"")+'">'+esc((S.names[m]&&S.names[m].name)||m.split("@")[0])+(done?" · 저장함":" · 아직")+'</span>'}).join("")+'</div>';
}
function myVersion(s,mine){
  return lockBox({key:"ver:"+s.id,label:"내 번역",value:mine,at:(s.versionsAt||{})[S.uid],ta:"v-"+s.id,action:"save-ver",attrs:'data-id="'+esc(s.id)+'"'});
}
function field(s,k,label,ph){
  if(!S.canWrite)return s[k]?'<div><p class="sub">'+label+'</p><p class="src">'+esc(s[k])+'</p></div>':"";
  return lockBox({key:"f:"+k+":"+s.id,label,value:s[k]||"",ta:k+"-"+s.id,action:"save-field",attrs:'data-k="'+k+'" data-id="'+esc(s.id)+'"',ph,hint:"둘 다 고칠 수 있어요. 저장하면 잠겨요."});
}

function briefCard(b){

  const nm=m=>m===S.uid?"나":(S.names[m]&&S.names[m].name)||m.split("@")[0];
  const cnt=m=>{const r=S.copyStatus.find(x=>x.brief_id===b.id&&x.author===m);return r?Number(r.n):0};
  const mine=S.taglines.filter(t=>t.brief_id===b.id&&t.addedBy===S.uid).sort((x,y)=>x.createdAt-y.createdAt);
  const others=S.taglines.filter(t=>t.brief_id===b.id&&t.addedBy!==S.uid).sort((x,y)=>x.createdAt-y.createdAt);
  let c='<article class="card brief-card"><h3>'+esc(b.title)+'</h3><dl class="bspec">'+

    (b.rules?'<div class="rules"><b>조건</b> · '+esc(b.rules)+'</div>':"")+

  if(mine.length)c+='<div class="copies">'+mine.map(copyItem).join("")+'</div>';
  if(S.canWrite&&mine.length<3)c+='<form class="cmt-form" data-form="copy" data-brief="'+esc(b.id)+'"><input type="text" id="cp-'+esc(b.id)+'" lang="en" placeholder="'+(mine.length?"다른 버전 추가 (최대 3개)":"영어 카피를 써 보세요")+'" aria-label="영어 카피"><button class="btn small primary" type="submit">제출</button></form>';
  if(mine.length)c+=others.length?'<p class="sub" style="margin:0">상대 카피</p><div class="copies">'+others.map(copyItem).join("")+'</div>':'<p class="note" style="margin:0">상대가 아직 내지 않았어요. 내면 여기에 보여요.</p>';
  else c+='<p class="note" style="margin:0">내 카피를 먼저 내면 상대 카피가 보여요.</p>';
  return c+'</article>';

const seoulToday=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Seoul"});
function fmtDay(d){const [y,m,dd]=String(d).split("-");return y+". "+(+m)+". "+(+dd)+"."}
// 뜻·설명·어려운 단어·출처 용어 (오늘 카드와 지난 문장이 같이 쓴다)
function dailyBack(d){
  const term=S.terms.find(t=>t.id===d.term_id);
  const words=Array.isArray(d.words)?d.words:[];
  return '<p class="meaning">'+esc(d.translation||"번역이 아직 없어요.")+'</p>'+
    (d.explanation?'<p class="dexp">'+esc(d.explanation)+'</p>':"")+
    (words.length?'<p class="sub" style="margin:0">어려운 단어</p><dl class="dwords">'+words.map(w=>'<dt lang="en">'+esc(w.word)+'</dt><dd>'+esc(w.meaning)+(w.note?' · '+esc(w.note):"")+'</dd>').join("")+'</dl>':"")+
    (term?'<p class="note">출처 용어: <button class="link" data-action="goto-term" data-id="'+esc(term.id)+'">'+esc(term.word)+'</button></p>':"");
}
function vDaily(){
  const d=S.daily;
  if(!d)return '<div class="empty">'+esc(S.dailyErr||"오늘의 문장을 불러오는 중…")+'</div>';
  let h='<article class="daily"><p class="dday">'+fmtDay(d.day)+' · TODAY\'S SENTENCE</p><p class="dsent" lang="en">'+esc(d.sentence)+'</p>';
  if(!S.dailyOpen)h+='<button class="reveal" data-action="daily-open">뜻과 설명 보기</button>';
  else h+='<div class="back">'+dailyBack(d)+'<div><button class="link" data-action="daily-close">접기</button></div></div>';
  h+='<div class="social">'+starBtn("daily",d.day)+commentBlock("daily",d.day)+'</div></article>';
  if(S.dailyPast.length){
    const stars=S.dailyPast.filter(p=>isFav("daily",p.day));

/* ---------- web push ---------- */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
function b64u8(s){const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function refreshPush(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){S.pushState=isIOS&&!standalone?"ios-home":"unsupported";return}
  try{const reg=await navigator.serviceWorker.getRegistration("/");const sub=reg&&await reg.pushManager.getSubscription();
    S.pushState=sub?"on":(Notification.permission==="denied"?"denied":"off")}catch(_){S.pushState="off"}
}
async function pushOn(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){S.pushState="denied";render();return}
    const reg=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await S.sb.from("push_subscriptions").upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth});
    if(error)throw error;
    S.pushState="on";render();
    await callAssist({action:"test-push"});flash("휴대폰 알림을 켰어요. 테스트 알림을 보냈어요.");
  }catch(e){flash("알림을 켜지 못했어요. "+(e&&e.message||""))}
}
async function pushOff(){
  try{const reg=await navigator.serviceWorker.getRegistration("/");const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await S.sb.from("push_subscriptions").delete().eq("endpoint",sub.endpoint);await sub.unsubscribe()}}catch(_){}
  S.pushState="off";render();flash("이 기기의 휴대폰 알림을 껐어요.");
}

/* ---------- naming vote (이름 정하기) ---------- */
// 이름 뒤 주격 조사: 받침 있으면 "이", 없으면 "가". 나 → 내가.
function subj(m,nm){if(m===S.uid)return "내가";const w=nm(m),c=w.charCodeAt(w.length-1);const has=c>=0xAC00&&c<=0xD7A3?(c-0xAC00)%28!==0:false;return w+(has?"이":"가")}
function vNames(){
  const members=Object.keys(S.names);
  const nm=m=>m===S.uid?"나":(S.names[m]&&S.names[m].name)||m.split("@")[0];
  const votesOf=id=>S.nameVotes.filter(v=>v.candidate_id===id).map(v=>v.author);
  const active=S.names_c.filter(c=>c.shown&&!c.excluded).sort((a,b)=>a.sort-b.sort||String(a.created_at).localeCompare(String(b.created_at)));
  const pool=S.names_c.filter(c=>!c.shown&&!c.excluded);
  const out=S.names_c.filter(c=>c.excluded).sort((a,b)=>String(b.excluded_at).localeCompare(String(a.excluded_at)));
  let h='<p class="note">앱 이름 후보예요. 마음에 드는 후보에 모두 <b>좋아요</b>를 누르세요. 둘 다 좋아한 후보는 빨간 테두리로 표시돼요. 마음에 안 드는 후보는 <b>빼기</b>로 치우고 <b>다시 추천하기</b>로 새 후보를 받아요.</p>';
  // results
  const ranked=active.map(c=>({c,v:votesOf(c.id)})).filter(x=>x.v.length).sort((a,b)=>b.v.length-a.v.length||a.c.sort-b.c.sort);
  h+='<section class="card results"><p class="sub" style="margin:0">투표 결과</p>'+
    (ranked.length?ranked.map(x=>'<div class="rrow"><b>'+esc(x.c.name)+'</b><span class="bar"><i style="width:'+Math.round(100*x.v.length/Math.max(1,members.length))+'%"></i></span><span class="note">'+x.v.map(nm).map(esc).join(" · ")+(members.length&&x.v.length>=members.length?' · <b style="color:var(--ko)">둘 다 좋아해요</b>':'')+'</span></div>').join(""):'<p class="note" style="margin:0">아직 투표가 없어요. 아래 후보에 좋아요를 눌러 보세요.</p>')+'</section>';
  // candidates
  h+='<div class="ncards">'+active.map(c=>{
    const v=votesOf(c.id),mine=v.includes(S.uid),both=members.length>1&&v.length>=members.length;
    return '<article class="card nc'+(both?" both":"")+'"><p class="nm">'+esc(c.name)+'</p>'+(c.gloss?'<p class="gl">'+esc(c.gloss)+'</p>':"")+(c.why?'<p class="why">'+esc(c.why)+'</p>':"")+
      (c.added_by?'<p class="note" style="margin:0">'+esc(nm(c.added_by))+' 제안</p>':"")+
      '<div class="acts"><button class="btn small vote" data-action="nvote" data-id="'+esc(c.id)+'" aria-pressed="'+mine+'">'+(mine?"♥ 좋아요":"♡ 좋아요")+(v.length?" "+v.length:"")+'</button>'+
      askDel("빼기",{do:"nexclude",id:c.id,what:"후보 ‘"+c.name+"’",verb:"뺄까요?",ok:"빼기",extra:"두 사람 모두의 목록에서 빠져요. 빠진 후보에서 되살릴 수 있어요."})+
      '</div></article>';
  }).join("")+'</div>';
  if(!active.length)h+='<div class="empty">보이는 후보가 없어요. 다시 추천하기를 눌러 주세요.</div>';
  // actions
  h+='<div class="row-actions">'+(pool.length?'<button class="btn primary" data-action="nmore">다시 추천하기</button><span class="note">남은 추천 후보 '+pool.length+'개</span>':
    '<span class="note">준비된 추천 후보를 모두 봤어요.</span><button class="btn" data-action="nask">Claude에게 새 후보 요청</button>')+'</div>';
  h+='<details class="add" data-key="add-name"'+(S.open.has("add-name")?" open":"")+'><summary>직접 후보 추가</summary><form data-form="name">'+
    '<label class="f">이름<input type="text" id="n-name" required placeholder="예: 말결 노트"></label>'+
    '<label class="f">뜻 (한 줄)<input type="text" id="n-gloss" placeholder="이름의 뜻"></label>'+
    '<label class="f">왜 어울리는지<input type="text" id="n-why" placeholder="선택"></label>'+
    '<div class="row-actions"><button class="btn primary" type="submit">추가</button></div></form></details>';
  if(out.length)h+='<details class="add" data-key="names-out"'+(S.open.has("names-out")?" open":"")+'><summary>빠진 후보 '+out.length+'개</summary><div class="past">'+
    out.map(c=>'<div class="row"><p><b>'+esc(c.name)+'</b> <span class="note">· '+esc(subj(c.excluded_by||"",nm))+' 뺌</span></p><button class="link" data-action="nrestore" data-id="'+esc(c.id)+'">되살리기</button></div>').join("")+'</div></details>';
  return h;
}

/* ---------- 삭제 확인 팝업 ---------- */
// 삭제(되돌릴 수 없는 동작) 버튼. 누르면 확인 팝업이 뜨고, 확인해야 실행된다.
function askDel(label,o){
  return '<button class="link del-link" data-action="confirm" data-o="'+esc(JSON.stringify(o))+'">'+label+'</button>';
}
let pendingDel=null;
function openConfirm(o){
  pendingDel=o;
  const d=$("#cfm");
  $("#cfm-title").textContent="정말 "+(o.verb||"삭제할까요?");
  $("#cfm-what").textContent=o.what||"";
  $("#cfm-body").textContent=(o.extra?o.extra+" ":"")+(o.do==="del"?"삭제하면 되돌릴 수 없어요.":"");
  $("#cfm-ok").textContent=o.ok||"삭제";
  if(d.showModal)d.showModal();else d.setAttribute("open","");
  $("#cfm-cancel").focus();
}
function closeConfirm(){const d=$("#cfm");if(d.close)d.close();else d.removeAttribute("open");pendingDel=null}
async function runConfirmed(o){
  if(o.do==="del")await write(()=>S.sb.from(o.col).delete().eq("id",o.id),o.col==="comments"?"코멘트를 지웠어요.":"삭제했어요.");
  else if(o.do==="nexclude")await write(()=>S.sb.from("name_candidates").update({excluded:true,excluded_by:S.uid,excluded_at:new Date().toISOString()}).eq("id",o.id),"후보를 뺐어요. 빠진 후보에서 되살릴 수 있어요.");
}
document.addEventListener("click",async e=>{
  if(e.target.closest("#cfm-cancel")){closeConfirm();return}
  if(e.target.closest("#cfm-ok")){const o=pendingDel;closeConfirm();if(o)await runConfirmed(o);return}
  if(e.target.id==="cfm")closeConfirm(); // 바깥(배경) 클릭
});

/* ---------- writes ---------- */
function val(id){const el=document.getElementById(id);return el?el.value.trim():""}
function clear(ids){for(const i of ids)S.dirty.delete(i)}
async function write(fn,okMsg){
  try{const r=await fn();if(r&&r.error)throw r.error;await reload();if(okMsg)flash(okMsg)}
  catch(e){flash("저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.");return false}
  return true;
}
async function onSubmit(form){
  const kind=form.dataset.form;
  if(!S.sb)return;
  if(kind==="term"){
    const word=val("t-word"),meaning=val("t-meaning");if(!word||!meaning)return;

  }else if(kind==="request"){
    const title=val("q-title");if(!title)return;
    let newId=null;
    if(await write(async()=>{const r=await S.sb.from("requests").insert({title,kind:val("q-kind"),body:val("q-body")}).select("id").single();newId=r.data&&r.data.id;return r},"건의를 올렸어요. Claude가 확인할 거예요.")){clear(["q-title","q-kind","q-body"]);if(newId)callAssist({action:"request-posted",id:newId})}
  }else if(kind==="name"){
    const name=val("n-name");if(!name)return;
    if(await write(()=>S.sb.from("name_candidates").insert({name,gloss:val("n-gloss"),why:val("n-why"),shown:true}),"후보를 추가했어요: ‘"+name+"’"))clear(["n-name","n-gloss","n-why"]);

async function toggleFav(type,id){
  if(!S.sb||!S.uid)return;
  const k=fkey(type,id),on=S.favs.has(k);
  on?S.favs.delete(k):S.favs.add(k);render();
  const q=on?S.sb.from("favorites").delete().eq("author",S.uid).eq("target_type",type).eq("target_id",id)
            :S.sb.from("favorites").insert({target_type:type,target_id:id});
  const {error}=await q;
  if(error){on?S.favs.add(k):S.favs.delete(k);flash("즐겨찾기를 저장하지 못했어요.")}
}

  if(m==="reset")return '<form class="login" data-form="auth" data-mode="reset"><h2>비밀번호 재설정</h2><p class="note">가입한 이메일로 재설정 링크를 보내 드려요.</p>'+email+'<div class="actions"><button class="btn primary" type="submit">재설정 링크 받기</button><button type="button" class="link" data-action="auth-mode" data-v="login">로그인으로 돌아가기</button></div></form>';
  if(m==="signup")return '<form class="login" data-form="auth" data-mode="signup">'+tabs+'<p class="note">등록된 두 멤버의 이메일로만 가입할 수 있어요. 가입 후 확인 메일의 링크를 한 번 눌러 주세요.</p>'+email+
    '<label class="f">비밀번호 (8자 이상)<input type="password" id="l-pw" name="new-password" required minlength="8" autocomplete="new-password" '+INP+'></label>'+
    '<label class="f">비밀번호 확인<input type="password" id="l-pw2" required minlength="8" autocomplete="new-password" '+INP+'></label>'+
    '<div class="actions"><button class="btn primary" type="submit">가입하기</button></div></form>';
  return '<form class="login" data-form="auth" data-mode="login">'+tabs+''+email+
    '<label class="f">비밀번호<input type="password" id="l-pw" name="password" required autocomplete="current-password" '+INP+'></label>'+
    '<div class="actions"><button class="btn primary" type="submit">로그인</button><button type="button" class="link" data-action="auth-mode" data-v="reset">비밀번호를 잊었어요</button></div></form>';
}
function authError(e){
  const m=String(e&&e.message||"");
  if(/invalid login credentials/i.test(m))return "이메일이나 비밀번호가 맞지 않아요.";
  if(/email not confirmed/i.test(m))return "아직 이메일 확인 전이에요. 가입 확인 메일의 링크를 눌러 주세요.";
  if(/already registered|already exists/i.test(m))return "이미 가입한 이메일이에요. 로그인해 주세요.";
  if(/가입할 수 없는|hook|403/i.test(m))return "가입할 수 없는 이메일이에요. 등록된 멤버만 가입할 수 있어요.";
  if(/rate limit|too many/i.test(m))return "요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요.";
  return m||"처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.";
}
async function authSubmit(form){
  const mode=form.dataset.mode,email=val("l-email").toLowerCase(),pw=(document.getElementById("l-pw")||{}).value||"";
  const back=location.origin+"/";
  let r;
  if(mode==="login")r=await S.sb.auth.signInWithPassword({email,password:pw});
  else if(mode==="signup"){
    if(pw!==((document.getElementById("l-pw2")||{}).value||"")){flash("비밀번호가 서로 달라요.");return}
    r=await S.sb.auth.signUp({email,password:pw,options:{emailRedirectTo:back}});
    // 이미 가입된 이메일이면 Supabase는 오류 없이 identities가 빈 user를 돌려주고 메일을 보내지 않는다
    if(!r.error&&r.data&&r.data.user&&Array.isArray(r.data.user.identities)&&r.data.user.identities.length===0){
      S.authMode="reset";flash("이미 가입된 이메일이에요. 아래에서 비밀번호 재설정 링크를 받아 비밀번호를 정해 주세요.");return}
    if(!r.error){S.sent=email+" 으로 가입 확인 메일을 보냈어요. 링크를 누르면 로그인돼요.";clear(["l-email"]);render();return}
  }else if(mode==="reset"){
    r=await S.sb.auth.resetPasswordForEmail(email,{redirectTo:back});
    if(!r.error){S.sent=email+" 으로 비밀번호 재설정 링크를 보냈어요.";clear(["l-email"]);render();return}
  }else if(mode==="newpw"){
    r=await S.sb.auth.updateUser({password:pw});
    if(!r.error){S.authMode="login";flash("새 비밀번호를 저장했어요.");location.reload();return}
  }
  if(r&&r.error)flash(authError(r.error));
}

  else if(b.dataset.action==="auth-mode"){S.sent=null;S.authMode=b.dataset.v;render()}

const loaders={

    const [a,b,c]=await Promise.all([S.sb.from("sessions").select("*"),S.sb.from("session_versions").select("*"),S.sb.rpc("session_version_status")]);
    if(a.error)throw a.error;if(b.error)throw b.error;S.sessStatus=c.error?[]:(c.data||[]);
    {const {data:ms}=await S.sb.from("session_models").select("*");S.sessModels={};for(const m of ms||[])S.sessModels[m.session_id]=m}
    S.sessions=a.data.map(r=>{const versions={},versionsAt={};for(const v of b.data)if(v.session_id===r.id){versions[v.author]=v.body;versionsAt[v.author]=v.updated_at}return {...r,date:r.date||"",versions,versionsAt,createdAt:T(r)}})},
  async taglines(){
    const [a,b,c]=await Promise.all([S.sb.from("taglines").select("*"),S.sb.from("copy_briefs").select("*"),S.sb.rpc("copy_status")]);
    for(const r of [a,b,c])if(r.error)throw r.error;
    S.taglines=a.data.map(r=>({...r,addedBy:r.added_by,createdAt:T(r)}));S.briefs=b.data;S.copyStatus=c.data||[];
  },
  async comments(){const {data,error}=await S.sb.from("comments").select("*").order("created_at");if(error)throw error;S.comments=data},
  async favorites(){const {data,error}=await S.sb.from("favorites").select("target_type,target_id");if(error)throw error;
    S.favs=new Set(data.map(r=>fkey(r.target_type,r.target_id)))},
  async daily(){
    if(!S.daily||S.daily.day!==seoulToday()){
      const {data,error}=await S.sb.rpc("ensure_daily");if(error)throw error;
      S.daily=data&&data.day?data:null;S.dailyOpen=false;
      if(!S.daily)S.dailyErr="영어 예문이 있는 용어가 없어서 오늘의 문장을 고를 수 없어요.";
    }
    const {data:rows}=await S.sb.from("daily_sentences").select("*").order("day",{ascending:false}).limit(1000);
    const cur=(rows||[]).find(x=>S.daily&&x.day===S.daily.day);if(cur)S.daily=cur;
    S.dailyPast=(rows||[]).filter(x=>!S.daily||x.day!==S.daily.day);
  },
  async drills(){
    const [a,b,c,d]=await Promise.all([S.sb.from("drills").select("*"),S.sb.from("drill_answers").select("*"),S.sb.from("drill_models").select("*"),S.sb.rpc("drill_status")]);
    for(const r of [a,b,c,d])if(r.error)throw r.error;
    S.drills=a.data;S.drillAns=b.data;S.drillStatus=d.data||[];
    S.drillModels={};for(const m of c.data)S.drillModels[m.drill_id]=m;
  },
  async feedback(){
    const [a,b]=await Promise.all([S.sb.from("feedback_requests").select("*"),S.sb.from("mistake_notes").select("*")]);
    S.feedback=a.error?[]:a.data;S.mistakes=b.error?[]:b.data;
    if(S.isAdmin){const {data:q,error}=await S.sb.rpc("feedback_queue");S.fbQueue=error?[]:(q||[])}
  },
  async names(){
    const [a,b]=await Promise.all([S.sb.from("name_candidates").select("*"),S.sb.from("name_votes").select("candidate_id,author")]);
    if(a.error)throw a.error;if(b.error)throw b.error;S.names_c=a.data;S.nameVotes=b.data;
  },
  async requests(){const {data,error}=await S.sb.from("requests").select("*");if(error)throw error;S.requests=data},
  async reviews(){const {data,error}=await S.sb.from("reviews").select("*");if(error)throw error;
    const items={};for(const r of data)items[r.term_id]={box:r.box,due:r.due,last:r.last};S.review={exists:true,items}}
};
const TABLE_TO_LOADER={terms:"terms",sessions:"sessions",session_versions:"sessions",taglines:"taglines",copy_briefs:"taglines",comments:"comments",favorites:"favorites",daily_sentences:"daily",drills:"drills",drill_answers:"drills",requests:"requests",feedback_requests:"feedback",mistake_notes:"feedback",name_candidates:"names",name_votes:"names",reviews:"reviews"};
async function reload(which){
  const keys=which?[which]:Object.keys(loaders);
  await Promise.all(keys.map(k=>loaders[k]().catch(()=>{})));
  render();
}

/* ---------- boot ---------- */
render();
(async()=>{
  const cfg=window.RR_CONFIG;
  if(!cfg||!window.supabase){S.dbState="off";render();return}
  if(/type=recovery/.test(location.hash))S.authMode="newpw";
  S.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  let started=false;
  async function start(session){
    if(!session){S.dbState="login";$("#me").innerHTML="";render();return}
    if(started)return;started=true;
    S.uid=(session.user.email||"").toLowerCase();
    const {data:members}=await S.sb.from("members").select("email,display_name,drill_dir,is_admin");
    for(const m of members||[])S.names[m.email]={name:m.display_name};
    {const mine=(members||[]).find(m=>m.email===S.uid);if(mine&&mine.drill_dir)S.drillDir=mine.drill_dir;S.isAdmin=!!(mine&&mine.is_admin)}
    if(!(members||[]).some(m=>m.email===S.uid)){S.dbState="notmember";render();return}
    $("#me").innerHTML='<div class="bell-wrap"><button class="bell" id="bell" data-action="bell-toggle" aria-label="알림" aria-expanded="false">🔔<span class="tab-badge" hidden></span></button><div class="notif" id="notif" hidden></div></div><span>'+esc(S.names[S.uid].name)+'</span><button class="link" data-action="logout">로그아웃</button>';
    await reload();S.dbState="ready";
    if(location.pathname!==tabUrl(S.tab)||location.hash)history.replaceState(null,"",tabUrl(S.tab)+location.search);
    render();
    // 알림을 눌러 들어온 경우(/drills?fb=<요청 id>) 그 카드로 이동한다
    {const fb=new URLSearchParams(location.search).get("fb");if(fb){history.replaceState(null,"",location.pathname);openFeedback(fb)}}
    // 서비스 워커는 알림을 받으려고만 쓴다(오프라인 캐시 없음)
    if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
    refreshPush().then(renderBell);
    const ch=S.sb.channel("rr");
    for(const t of Object.keys(TABLE_TO_LOADER))ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>reload(TABLE_TO_LOADER[t]));
    ch.subscribe();
  }
  const {data}=await S.sb.auth.getSession();
  await start(data.session);
  S.sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"){S.authMode="newpw";render();return}if(ev==="SIGNED_IN")start(session);else if(ev==="SIGNED_OUT")location.reload()});
})();
})();
</script>
