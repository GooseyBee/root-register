<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Root &amp; Register</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231B2220%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%23E8736A%22 font-family=%22serif%22%3E%26%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#EEF1EE; --surface:#FAFBF9; --sunk:#E4E9E5; --ink:#1B2220; --muted:#5B6662; --line:#D3D9D5;
  --ko:#B4322A; --ko-soft:#F5E1DE; --en:#2D4A7A; --en-soft:#DFE6F1;
  --ok:#2E7D4F; --warn:#9A6210; --bad:#B4322A;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131816; --surface:#1B2220; --sunk:#232C29; --ink:#E4EAE7; --muted:#9AA6A1; --line:#2F3935;
    --ko:#E8736A; --ko-soft:#3A2321; --en:#93ADDC; --en-soft:#1F2A3D;
    --ok:#62C08A; --warn:#E0A94A; --bad:#E8736A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131816; --surface:#1B2220; --sunk:#232C29; --ink:#E4EAE7; --muted:#9AA6A1; --line:#2F3935;
  --ko:#E8736A; --ko-soft:#3A2321; --en:#93ADDC; --en-soft:#1F2A3D;
  --ok:#62C08A; --warn:#E0A94A; --bad:#E8736A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:880px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:28px 16px}
.brand h1{margin:0;font:700 26px/1.2 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.brand h1 .amp{color:var(--ko)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.me img{width:26px;height:26px;border-radius:50%}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 12px/1.4 var(--mono);color:var(--muted);letter-spacing:.02em;padding-bottom:14px;border-bottom:1px solid var(--line)}
.stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;margin-bottom:14px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);font:500 14px var(--sans);padding:7px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--en);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.panel{display:grid;gap:14px}
.note{font-size:13px;color:var(--muted);margin:0}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--sunk);font-size:13px}
.chip{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.04em;padding:4px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ko{background:var(--ko-soft);color:var(--ko)}
.chip.en{background:var(--en-soft);color:var(--en)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink)}
textarea{min-height:84px;resize:vertical;line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
details.add{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
details.add>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;list-style:none}
details.add>summary::-webkit-details-marker{display:none}
details.add>summary::before{content:"+ ";color:var(--ko)}
details.add[open]>summary::before{content:"– "}
details.add form{display:grid;gap:10px;padding:0 16px 16px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.ko-word{font-family:var(--serif)}

/* review */
.rv-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;display:grid;gap:16px;min-height:280px;align-content:start}
.flash .word{font-size:clamp(28px,7vw,40px);line-height:1.25;font-weight:700;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.flash .word.en{font-family:var(--sans);font-weight:600;color:var(--en)}
.flash .word.ko{font-family:var(--serif);color:var(--ko)}
.flash .back{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.exs{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:ex}
.exs li{display:grid;gap:1px;padding-left:26px;position:relative;counter-increment:ex}
.exs li::before{content:counter(ex);position:absolute;left:0;top:2px;font:500 11px/18px var(--mono);width:18px;text-align:center;border-radius:50%;background:var(--sunk);color:var(--muted)}
.exs .s{font-size:15px}
.exs .s mark{background:none;color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--ko);text-underline-offset:3px}
.exs .t{font-size:13px;color:var(--muted)}
.exs.small .s{font-size:14px}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flash .meaning{font-size:18px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:grid;gap:2px}
.grade button small{font:400 11px var(--mono);color:var(--muted)}
.grade .g-again{color:var(--bad)} .grade .g-hard{color:var(--warn)} .grade .g-good{color:var(--ok)}
.reveal{width:100%;padding:14px;border-radius:10px;border:1px dashed var(--muted);background:none;cursor:pointer;font-weight:600;color:var(--muted)}
.boxes{display:flex;gap:6px;font:12px var(--mono);color:var(--muted);flex-wrap:wrap}
.boxes span b{color:var(--ink);font-weight:500}

/* glossary */
.filters{display:grid;gap:8px}
.filters .sel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.terms{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.term{display:grid;gap:4px;padding:12px 16px;border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.term .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.term .w{font-size:18px;font-weight:600}
.term .w.ko{font-family:var(--serif);font-weight:700}
.term .pair{color:var(--muted);font-size:14px}
.term .ex{font-size:14px;color:var(--muted);margin:0;font-style:italic}
.term .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* sessions */
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sess>summary{cursor:pointer;padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;list-style:none}
details.sess>summary::-webkit-details-marker{display:none}
.sno{font:500 12px var(--mono);color:var(--ko);letter-spacing:.06em}
.stitle{font-weight:600}
.sdate{font:12px var(--mono);color:var(--muted)}
.sbody{padding:0 16px 16px;display:grid;gap:14px}
.src{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px 14px;margin:0;font-size:15px}
.sub{font:600 12px var(--sans);color:var(--muted);letter-spacing:.04em;margin:0 0 6px}
.vers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ver{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.ver p{margin:0;white-space:pre-wrap}
.who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.who img{width:18px;height:18px;border-radius:50%}

/* taglines */
.tl{display:grid;gap:10px}
.tl .t{font:700 22px/1.3 var(--sans);letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.tl .brief{font-size:13px;color:var(--muted);margin:0}
.cmts{display:grid;gap:8px;border-left:2px solid var(--line);padding-left:12px}
.cmt{font-size:14px}
.cmt .who{margin-bottom:2px}
.cmt p{margin:0;white-space:pre-wrap}
.cmt-form{display:flex;gap:8px}
.cmt-form input{flex:1;min-width:0}
.social{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.social .cmts,.social .cmt-form{flex-basis:100%}
.star{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:2px 4px;color:var(--muted)}
.star.on{color:var(--warn)}
.cmt .link{margin-top:2px}
.daily{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;display:grid;gap:18px}
.dday{margin:0;font:500 12px var(--mono);color:var(--ko);letter-spacing:.06em}
.dsent{margin:0;font:600 clamp(22px,5vw,30px)/1.4 var(--sans);color:var(--en);text-wrap:pretty;overflow-wrap:anywhere}
.dexp{margin:0;font-size:15px}
.dwords{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.dwords dt{font-weight:600;color:var(--en)}
.dwords dd{margin:0}
.past{display:grid;gap:10px;padding:0 16px 16px}
.past .row{display:flex;gap:10px;align-items:baseline}
.past .row p{margin:0;flex:1;font-size:14px}
.drill{display:grid;gap:12px}
.drill .ko{margin:0;font:700 19px/1.5 var(--serif)}
.drill .ctx{margin:0;font-size:12px;color:var(--muted)}
.drill .status{display:flex;flex-wrap:wrap;gap:6px}
.chip.done{background:var(--en-soft);color:var(--en)}
.model{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.model .best{margin:0;font:600 17px/1.5 var(--sans);color:var(--en)}
.model ul{margin:0;padding-left:18px;font-size:14px}
.login{width:100%;max-width:400px;margin:40px auto 0;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:16px}
.login h2{margin:0;font:700 22px var(--serif)}
.login .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
.login .seg button{padding:10px;font-size:14px;font-weight:500}
.login .note{margin:-6px 0 0}
.login input[type=email],.login input[type=password]{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px 12px;font-size:16px;color:var(--ink)}
.login input:focus{border-color:var(--en);outline:none;box-shadow:0 0 0 3px var(--en-soft)}
.login .actions{display:grid;gap:10px;justify-items:center;margin-top:4px}
.login .actions .btn.primary{width:100%;padding:12px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.flash{transition:border-color .2s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Root <span class="amp">&amp;</span> Register</h1>
      <p>뿌리와 결 · 통번역사와 카피라이터의 어원·격 공동 노트</p>
    </div>
    <div class="me" id="me"></div>
  </header>
  <div class="stats" id="stats"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="daily">오늘의 문장</button>
    <button role="tab" data-tab="drills">번역 연습</button>
    <button role="tab" data-tab="review">오늘의 복습</button>
    <button role="tab" data-tab="terms">용어집</button>
    <button role="tab" data-tab="sessions">세션 기록</button>
    <button role="tab" data-tab="taglines">태그라인 보드</button>
  </nav>
  <main id="panel" class="panel" aria-live="polite"></main>
</div>

<script>
(function(){
"use strict";
const DOMAINS=["일반","마케팅·브랜드","비즈니스·IR","시사·테크","공문·행정"];
const REGISTERS=["구어","문어","전문"];
const INTERVAL={1:1,2:2,3:4,4:8,5:16};
const TABS=["daily","drills","review","terms","sessions","taglines"];
const TOPICS=[["marketing","마케팅·광고"],["business","비즈니스·이메일"],["daily","일상 회화"],["travel","여행 표현"]];

const S={
  sb:null,uid:null,canWrite:true,dbState:"loading",sent:null,
  terms:[],sessions:[],taglines:[],comments:[],favs:new Set(),daily:null,dailyPast:[],dailyOpen:false,dailyErr:"",
  favOnly:{terms:false,sessions:false,taglines:false},
  drills:[],drillAns:[],drillModels:{},drillStatus:[],drillTopic:"marketing",drillFilter:"all",cmtOpen:new Set(),
  review:{exists:false,items:{}},
  tab:"daily",revealed:false,reviewLang:"all",seen:{},
  f:{q:"",lang:"all",reg:"all",dom:"all"},
  names:{},open:new Set(),confirm:null,dirty:new Map(),pending:false,msg:"",shown:new Set(),showAll:false
};
if(TABS.includes(location.hash.slice(1)))S.tab=location.hash.slice(1);

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const isKo=s=>/[ㄱ-힝一-鿿]/.test(s||"");
function exs(t){
  const a=Array.isArray(t.examples)&&t.examples.length?t.examples:(t.example?[t.example]:[]);
  return a.map(x=>typeof x==="string"?{s:x,t:""}:{s:String(x&&x.s||""),t:String(x&&x.t||"")}).filter(x=>x.s);
}
function exList(t,cls,noT){
  const a=exs(t);if(!a.length)return "";
  const w=String(t.word||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const stem=t.lang==="ko"?w.replace(/하다$|다$/,""):w.split(" ")[0];
  const re=stem.length>=2?new RegExp("("+stem+"[\\w가-힣]*)","i"):null;
  return '<ol class="exs'+(cls?" "+cls:"")+'">'+a.map(x=>{let h=esc(x.s);if(re)h=h.replace(re,"<mark>$1</mark>");return '<li><span class="s">'+h+'</span>'+(x.t&&!noT?'<span class="t">'+esc(x.t)+'</span>':"")+'</li>'}).join("")+'</ol>';
}

/* ---------- names ---------- */
function whoHTML(id){
  if(!id)return '<span class="who">예시</span>';
  const p=S.names[id];
  const nm=id===S.uid?"나":(p&&p.name)||id.split("@")[0];
  const av=p&&p.avatarUrl?'<img alt="" src="'+esc(p.avatarUrl)+'">':"";
  return '<span class="who">'+av+esc(nm)+'</span>';
}
function resolveNames(){}

/* ---------- review logic ---------- */
function rec(id){return (S.review.items||{})[id]||null}
function dueTerms(){
  const t=today();
  return S.terms.filter(x=>{
    if(S.reviewLang!=="all"&&x.lang!==S.reviewLang)return false;
    const r=rec(x.id);return !r||!r.due||r.due<=t;
  }).sort((a,b)=>(S.seen[a.id]||0)-(S.seen[b.id]||0)||((rec(a.id)?1:0)-(rec(b.id)?1:0))||(a.createdAt||0)-(b.createdAt||0));
}
async function grade(id,g){
  if(!S.sb||!S.uid)return;
  const r=rec(id)||{box:0};
  let box=r.box||0,due;
  if(g==="again"){box=1;due=today()}
  else if(g==="hard"){box=Math.max(1,box);due=addDays(1)}
  else {box=Math.min(5,box+1);due=addDays(INTERVAL[box])}
  S.seen[id]=Date.now();S.revealed=false;
  const entry={box,due,last:today()};
  S.review.items={...S.review.items,[id]:entry};
  render();
  try{
    const {error}=await S.sb.from("reviews").upsert({author:S.uid,term_id:id,box,due,last:today()});
    if(error)throw error;
  }catch(e){flash("복습 기록을 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.")}
}

/* ---------- render ---------- */
function flash(m){S.msg=m;render();setTimeout(()=>{if(S.msg===m){S.msg="";render()}},4000)}
function renderStats(){
  const due=S.terms.length?dueTerms().length:0;
  const ready=S.dbState==="ready";$("#stats").hidden=!ready;$("#tabs").hidden=!ready;
  $("#stats").innerHTML=
    '<span>오늘 복습 <b>'+due+'</b></span><span>용어 <b>'+S.terms.length+'</b></span><span>번역 연습 <b>'+S.drillStatus.filter(x=>x.author===S.uid).length+'</b>/'+S.drills.length+'</span><span>즐겨찾기 <b>'+S.favs.size+'</b></span><span>세션 <b>'+S.sessions.length+'</b>/12</span><span>태그라인 <b>'+S.taglines.length+'</b></span>';
  for(const b of document.querySelectorAll("#tabs button"))b.setAttribute("aria-selected",String(b.dataset.tab===S.tab));
}
function render(){
  const ae=document.activeElement;
  if(ae&&$("#panel").contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=="button"){S.pending=true;renderStats();return}
  S.pending=false;
  renderStats();
  let h="";
  if(S.msg)h+='<div class="banner" role="status">'+esc(S.msg)+'</div>';
  if(S.authMode==="newpw")h+=vLogin();
  else if(S.dbState==="loading")h+='<div class="empty">노트를 불러오는 중…</div>';
  else if(S.dbState==="off")h+='<div class="banner">설정(config.js)을 불러오지 못했어요. 관리자에게 알려 주세요.</div>';
  else if(S.dbState==="login")h+=vLogin();

function opt(list,sel,all){return (all?'<option value="all">'+all+'</option>':"")+list.map(v=>'<option'+(v===sel?" selected":"")+'>'+esc(v)+'</option>').join("")}
function langChip(l){return l==="ko"?'<span class="chip ko">한국어</span>':'<span class="chip en">ENGLISH</span>'}

function vReview(){
  if(!S.terms.length)return '<div class="empty">아직 용어가 없어요. 용어집에서 첫 용어를 추가해 보세요.</div>';
  const q=dueTerms();
  const counts=[0,0,0,0,0,0];for(const t of S.terms){const r=rec(t.id);counts[r?r.box||0:0]++}
  let h='<div class="rv-top"><div class="seg" role="group" aria-label="언어">'+
    [["all","전체"],["en","영어"],["ko","한국어"]].map(([k,l])=>'<button data-action="rlang" data-v="'+k+'" aria-pressed="'+(S.reviewLang===k)+'">'+l+'</button>').join("")+
    '</div><div class="boxes"><span>새 용어 <b>'+counts[0]+'</b></span>'+[1,2,3,4,5].map(i=>'<span>'+i+'단계 <b>'+counts[i]+'</b></span>').join("")+'</div></div>';
  if(!S.uid)return h+'<div class="banner">복습 기록은 사람마다 따로 저장돼요. 로그인한 상태에서 열어야 복습할 수 있어요.</div>';
  if(!q.length)return h+'<div class="empty">오늘 복습할 용어를 모두 끝냈어요. 다음 복습은 내일 이후에 돌아와요.</div>';
  const t=q[0],r=rec(t.id);
  h+='<article class="flash"><div class="chips">'+langChip(t.lang)+'<span class="chip">'+esc(t.register||"")+'</span><span class="chip">'+esc(t.domain||"")+'</span>'+(r?'<span class="chip">'+r.box+'단계</span>':'<span class="chip">새 용어</span>')+'<span class="chip">남은 카드 '+q.length+'</span>'+starBtn("term",t.id)+'</div>'+
    '<p class="word '+(t.lang==="ko"?"ko":"en")+'">'+esc(t.word)+'</p>';
  if(!S.revealed)h+='<button class="reveal" data-action="reveal">뜻 보기</button>';
  else{
    h+='<div class="back"><p class="meaning">'+esc(t.meaning)+'</p><dl class="kv">'+
      (t.pair?'<dt>대응 표현</dt><dd>'+esc(t.pair)+'</dd>':"")+
      '</dl>'+exBlock(t)+'</div><div class="grade">'+
      '<button class="g-again" data-action="grade" data-g="again" data-id="'+esc(t.id)+'">다시<small>오늘 한 번 더</small></button>'+
      '<button class="g-hard" data-action="grade" data-g="hard" data-id="'+esc(t.id)+'">애매<small>내일</small></button>'+
      '<button class="g-good" data-action="grade" data-g="good" data-id="'+esc(t.id)+'">알았음<small>'+INTERVAL[Math.min(5,(r&&r.box||0)+1)]+'일 뒤</small></button></div>';
  }
  return h+'</article>';
}

function exBlock(t){

    let c='<article class="card drill"><p class="ctx">'+esc(d.context)+'</p><p class="ko">'+esc(d.ko)+'</p>'+
      '<div class="status">'+members.map(m=>'<span class="chip'+(submitted(d.id,m)?" done":"")+'">'+esc(m===S.uid?"나":(S.names[m]&&S.names[m].name)||m.split("@")[0])+(submitted(d.id,m)?" · 제출함":" · 아직")+'</span>').join("")+'</div>';
    if(S.canWrite)c+='<label class="f">내 번역<textarea id="da-'+esc(d.id)+'" lang="en" placeholder="영어로 번역해 보세요">'+esc(mine?mine.body:"")+'</textarea></label>'+
      '<div class="row-actions"><button class="btn small'+(mine?"":" primary")+'" data-action="drill-save" data-id="'+esc(d.id)+'">'+(mine?"수정":"제출")+'</button>'+(mine?'<span class="note">제출함</span>':"")+'</div>';
    if(mine){
      if(others.length)c+='<div class="vers">'+others.map(a=>'<div class="ver">'+whoHTML(a.author)+'<p lang="en">'+esc(a.body)+'</p></div>').join("")+'</div>';
      else c+='<p class="note">상대가 제출하면 번역이 보여요.</p>';
    }
    if(allIn&&model){
      if(!open)c+='<button class="reveal" data-action="drill-model" data-id="'+esc(d.id)+'">추천 표현 보기</button>';
      else c+='<div class="model"><p class="sub" style="margin:0">추천 표현</p><p class="best" lang="en">'+esc(model.best)+'</p>'+
        ((model.alternatives||[]).length?'<p class="sub" style="margin:0">다르게 말하면</p><ul>'+model.alternatives.map(x=>'<li lang="en">'+esc(x)+'</li>').join("")+'</ul>':"")+
        ((model.notes||[]).length?'<p class="sub" style="margin:0">포인트</p><dl class="dwords">'+model.notes.map(n=>'<dt lang="en">'+esc(n.phrase)+'</dt><dd>'+esc(n.why)+'</dd>').join("")+'</dl>':"")+
        '<div><button class="link" data-action="drill-model" data-id="'+esc(d.id)+'">접기</button></div></div>';
    }else if(!allIn)c+='<p class="note">추천 표현은 모두 제출하면 열려요.</p>';
    c+='<div class="social">'+starBtn("drill",d.id)+commentBlock("drill",d.id)+'</div></article>';
    return c;
  }).join("");
}

/* ---------- writes ---------- */
function val(id){const el=document.getElementById(id);return el?el.value.trim():""}
function clear(ids){for(const i of ids)S.dirty.delete(i)}
async function write(fn,okMsg){
  try{const r=await fn();if(r&&r.error)throw r.error;await reload();if(okMsg)flash(okMsg)}
  catch(e){flash("저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.");return false}
  return true;
}
async function onSubmit(form){
  const kind=form.dataset.form;
  if(!S.sb)return;
  if(kind==="term"){
    const word=val("t-word"),meaning=val("t-meaning");if(!word||!meaning)return;
    const doc={word,meaning,pair:val("t-pair"),examples:val("t-example").split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,5).map(x=>{const [a,...b]=x.split("|");return {s:a.trim(),t:b.join("|").trim()}}),register:val("t-reg"),domain:val("t-dom"),lang:isKo(word)?"ko":"en"};
    if(await write(()=>S.sb.from("terms").insert(doc),"‘"+word+"’을(를) 추가했어요."))clear(["t-word","t-meaning","t-pair","t-example"]);
  }else if(kind==="session"){
    const doc={no:Number(val("s-no"))||1,date:val("s-date")||null,dir:val("s-dir"),title:val("s-title"),source:val("s-src")};
    if(!doc.title||!doc.source)return;
    if(await write(()=>S.sb.from("sessions").insert(doc),"세션 원문을 추가했어요."))clear(["s-no","s-date","s-dir","s-title","s-src"]);
  }else if(kind==="tagline"){
    const text=val("g-text");if(!text)return;
    const doc={text,brief:val("g-brief")};
    if(await write(()=>S.sb.from("taglines").insert(doc),"태그라인을 올렸어요."))clear(["g-text","g-brief"]);
  }else if(kind==="comment"){
    const type=form.dataset.type,id=form.dataset.id,iid="c-"+type+"-"+id,text=val(iid);if(!text)return;
    if(await write(()=>S.sb.from("comments").insert({target_type:type,target_id:id,body:text})))clear([iid]);
  }
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
  render();
}

async function toggleFav(type,id){
  if(!S.sb||!S.uid)return;
  const k=fkey(type,id),on=S.favs.has(k);
  on?S.favs.delete(k):S.favs.add(k);render();
  const q=on?S.sb.from("favorites").delete().eq("author",S.uid).eq("target_type",type).eq("target_id",id)
            :S.sb.from("favorites").insert({target_type:type,target_id:id});
  const {error}=await q;
  if(error){on?S.favs.add(k):S.favs.delete(k);flash("즐겨찾기를 저장하지 못했어요.")}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const tb=e.target.closest("#tabs button");
  if(tb){S.tab=tb.dataset.tab;S.confirm=null;S.revealed=falserender();return}
  const b=e.target.closest("[data-action]");if(!b)return;
  const a=b.dataset.action,id=b.dataset.id;
  if(a==="toggle-term"){S.shown.has(id)?S.shown.delete(id):S.shown.add(id);render()}
  else if(a==="show-all"){S.showAll=!S.showAll;S.shown.clear();render()}
  else if(a==="reveal"){S.revealed=true;render()}
  else if(a==="fav"){e.preventDefault();toggleFav(b.dataset.type,id)}
  else if(a==="fav-only"){const l=b.dataset.list;S.favOnly[l]=!S.favOnly[l];render()}
  else if(a==="cmt-toggle"){const k=b.dataset.k;S.cmtOpen.has(k)?S.cmtOpen.delete(k):S.cmtOpen.add(k);render()}
  else if(a==="cmt-del"){S.confirm=null;await write(()=>S.sb.from("comments").delete().eq("id",id),"코멘트를 지웠어요.")}
  else if(a==="drill-topic"){S.drillTopic=b.dataset.v;render()}
  else if(a==="drill-filter"){S.drillFilter=b.dataset.v;render()}
  else if(a==="drill-model"){const k="model-"+id;S.open.has(k)?S.open.delete(k):S.open.add(k);render()}
  else if(a==="drill-save"){
    const v=((document.getElementById("da-"+id)||{}).value||"").trim();
    if(!v){flash("번역을 입력해 주세요.");return}
    if(await write(()=>S.sb.from("drill_answers").upsert({drill_id:id,author:S.uid,body:v,updated_at:new Date().toISOString()}),"번역을 제출했어요."))clear(["da-"+id]);
  }
  else if(a==="daily-open"){S.dailyOpen=true;render()}
  else if(a==="daily-close"){S.dailyOpen=false;render()}
  else if(a==="goto-term"){const t=S.terms.find(x=>x.id===id);if(t){S.tab="terms";S.f={q:t.word,lang:"all",reg:"all",dom:"all"};S.shown.add(t.id);render()}}
  else if(a==="grade")grade(id,b.dataset.g);
  else if(a==="rlang"){S.reviewLang=b.dataset.v;S.revealed=false;render()}
  else if(a==="ask"){S.confirm=id;render()}
  else if(a==="cancel"){S.confirm=null;render()}
  else if(a==="del"){S.confirm=null;await write(()=>S.sb.from(b.dataset.col).delete().eq("id",id),"삭제했어요.")}
  else if(a==="save-ver"){
    if(!S.uid)return;const v=(document.getElementById("v-"+id)||{}).value||"";
    if(await write(()=>S.sb.from("session_versions").upsert({session_id:id,author:S.uid,body:v,updated_at:new Date().toISOString()}),"번역을 저장했어요."))clear(["v-"+id]);
  }else if(a==="save-field"){
    const k=b.dataset.k,v=(document.getElementById(k+"-"+id)||{}).value||"";
    if(await write(()=>S.sb.from("sessions").update({[k]:v}).eq("id",id),"저장했어요."))clear([k+"-"+id]);
  }
});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.dataset.form==="auth")authSubmit(e.target);else onSubmit(e.target)});
document.addEventListener("input",e=>{
  const t=e.target;if(!t.id)return;
  if(t.id==="f-q"){S.f.q=t.value;return}
  if(t.closest&&t.closest("#panel"))S.dirty.set(t.id,t.value);
});
document.addEventListener("change",e=>{
  const t=e.target,m={"f-lang":"lang","f-reg":"reg","f-dom":"dom"}[t.id];
  if(m){S.f[m]=t.value;t.blur();render()}
});
document.addEventListener("keyup",e=>{if(e.target.id==="f-q"){const ae=e.target,pos=ae.selectionStart;S.pending=false;
  // re-render the list while keeping the search box focused
  const saved=document.activeElement;saved.blur();render();const n=document.getElementById("f-q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener("toggle",e=>{
  const d=e.target;if(!(d instanceof HTMLDetailsElement)||!d.dataset.key)return;
  if(d.dataset.key.startsWith("sess-"))S.open.add("touched-sess");
  if(d.open)S.open.add(d.dataset.key);else S.open.delete(d.dataset.key);
},true);
document.addEventListener("focusout",()=>{setTimeout(()=>{if(S.pending)render()},0)});
document.addEventListener("keydown",e=>{
  if(S.tab!=="review"||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
  if(e.key===" "&&!S.revealed&&document.querySelector('[data-action="reveal"]')){e.preventDefault();S.revealed=true;render()}
  else if(S.revealed&&["1","2","3"].includes(e.key)){const g=["again","hard","good"][+e.key-1];const b=document.querySelector('[data-action="grade"][data-g="'+g+'"]');if(b)b.click()}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.includes(h)){S.tab=h;render()}});

/* ---------- auth ---------- */
const INP='';
function vLogin(){
  const m=S.authMode||"login";
  if(S.sent)return '<div class="login"><h2>메일함을 확인하세요</h2><p class="note">'+esc(S.sent)+'</p><div class="actions"><button class="link" data-action="auth-mode" data-v="login">로그인 화면으로</button></div></div>';
  const tabs='<div class="seg" role="group" aria-label="로그인 방식"><button type="button" data-action="auth-mode" data-v="login" aria-pressed="'+(m==="login")+'">로그인</button><button type="button" data-action="auth-mode" data-v="signup" aria-pressed="'+(m==="signup")+'">회원가입</button></div>';
  const email='<label class="f">이메일<input type="email" id="l-email" name="email" required autocomplete="username" '+INP+'></label>';
  if(m==="newpw")return '<form class="login" data-form="auth" data-mode="newpw"><h2>새 비밀번호 설정</h2><input type="hidden" name="email" autocomplete="username" value="'+esc(S.uid||"")+'"><label class="f">새 비밀번호 (8자 이상)<input type="password" id="l-pw" name="new-password" required minlength="8" autocomplete="new-password" '+INP+'></label><div class="actions"><button class="btn primary" type="submit">저장</button></div></form>';
  if(m==="reset")return '<form class="login" data-form="auth" data-mode="reset"><h2>비밀번호 재설정</h2><p class="note">가입한 이메일로 재설정 링크를 보내 드려요.</p>'+email+'<div class="actions"><button class="btn primary" type="submit">재설정 링크 받기</button><button type="button" class="link" data-action="auth-mode" data-v="login">로그인으로 돌아가기</button></div></form>';
  if(m==="signup")return '<form class="login" data-form="auth" data-mode="signup">'+tabs+'<p class="note">등록된 두 멤버의 이메일로만 가입할 수 있어요. 가입 후 확인 메일의 링크를 한 번 눌러 주세요.</p>'+email+
    '<label class="f">비밀번호 (8자 이상)<input type="password" id="l-pw" name="new-password" required minlength="8" autocomplete="new-password" '+INP+'></label>'+
    '<label class="f">비밀번호 확인<input type="password" id="l-pw2" required minlength="8" autocomplete="new-password" '+INP+'></label>'+
    '<div class="actions"><button class="btn primary" type="submit">가입하기</button></div></form>';
  return '<form class="login" data-form="auth" data-mode="login">'+tabs+''+email+
    '<label class="f">비밀번호<input type="password" id="l-pw" name="password" required autocomplete="current-password" '+INP+'></label>'+
    '<div class="actions"><button class="btn primary" type="submit">로그인</button><button type="button" class="link" data-action="auth-mode" data-v="reset">비밀번호를 잊었어요</button></div></form>';
}
function authError(e){
  const m=String(e&&e.message||"");
  if(/invalid login credentials/i.test(m))return "이메일이나 비밀번호가 맞지 않아요.";
  if(/email not confirmed/i.test(m))return "아직 이메일 확인 전이에요. 가입 확인 메일의 링크를 눌러 주세요.";
  if(/already registered|already exists/i.test(m))return "이미 가입한 이메일이에요. 로그인해 주세요.";
  if(/가입할 수 없는|hook|403/i.test(m))return "가입할 수 없는 이메일이에요. 등록된 멤버만 가입할 수 있어요.";
  if(/rate limit|too many/i.test(m))return "요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요.";
  return m||"처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.";
}
async function authSubmit(form){
  const mode=form.dataset.mode,email=val("l-email").toLowerCase(),pw=(document.getElementById("l-pw")||{}).value||"";
  const back=location.origin+location.pathname;
  let r;
  if(mode==="login")r=await S.sb.auth.signInWithPassword({email,password:pw});
  else if(mode==="signup"){
    if(pw!==((document.getElementById("l-pw2")||{}).value||"")){flash("비밀번호가 서로 달라요.");return}
    r=await S.sb.auth.signUp({email,password:pw,options:{emailRedirectTo:back}});
    if(!r.error){S.sent=email+" 으로 가입 확인 메일을 보냈어요. 링크를 누르면 로그인돼요.";clear(["l-email"]);render();return}
  }else if(mode==="reset"){
    r=await S.sb.auth.resetPasswordForEmail(email,{redirectTo:back});
    if(!r.error){S.sent=email+" 으로 비밀번호 재설정 링크를 보냈어요.";clear(["l-email"]);render();return}
  }else if(mode==="newpw"){
    r=await S.sb.auth.updateUser({password:pw});
    if(!r.error){S.authMode="login";flash("새 비밀번호를 저장했어요.");location.reload();return}
  }
  if(r&&r.error)flash(authError(r.error));
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-action]");if(!b)return;
  if(b.dataset.action==="logout"){await S.sb.auth.signOut();location.reload()}
  else if(b.dataset.action==="auth-mode"){S.sent=null;S.authMode=b.dataset.v;render()}
});

/* ---------- data ---------- */
const T=r=>new Date(r.created_at).getTime();
const loaders={
  async terms(){const {data,error}=await S.sb.from("terms").select("*").limit(5000);if(error)throw error;
    S.terms=data.map(r=>({...r,addedBy:r.added_by,createdAt:T(r)}))},
  async sessions(){
    const [a,b]=await Promise.all([S.sb.from("sessions").select("*"),S.sb.from("session_versions").select("*")]);
    if(a.error)throw a.error;if(b.error)throw b.error;
    S.sessions=a.data.map(r=>{const versions={};for(const v of b.data)if(v.session_id===r.id)versions[v.author]=v.body;return {...r,date:r.date||"",versions,createdAt:T(r)}})},
  async taglines(){const {data,error}=await S.sb.from("taglines").select("*");if(error)throw error;
    S.taglines=data.map(r=>({...r,addedBy:r.added_by,createdAt:T(r)}))},
  async comments(){const {data,error}=await S.sb.from("comments").select("*").order("created_at");if(error)throw error;S.comments=data},
  async favorites(){const {data,error}=await S.sb.from("favorites").select("target_type,target_id");if(error)throw error;
    S.favs=new Set(data.map(r=>fkey(r.target_type,r.target_id)))},
  async daily(){
    if(!S.daily||S.daily.day!==seoulToday()){
      const {data,error}=await S.sb.rpc("ensure_daily");if(error)throw error;
      S.daily=data&&data.day?data:null;S.dailyOpen=false;
      if(!S.daily)S.dailyErr="영어 예문이 있는 용어가 없어서 오늘의 문장을 고를 수 없어요.";
    }
    const {data:rows}=await S.sb.from("daily_sentences").select("*").order("day",{ascending:false}).limit(8);
    const cur=(rows||[]).find(x=>S.daily&&x.day===S.daily.day);if(cur)S.daily=cur;
    S.dailyPast=(rows||[]).filter(x=>!S.daily||x.day!==S.daily.day).slice(0,7);
  },
  async drills(){
    const [a,b,c,d]=await Promise.all([S.sb.from("drills").select("*"),S.sb.from("drill_answers").select("*"),S.sb.from("drill_models").select("*"),S.sb.rpc("drill_status")]);
    for(const r of [a,b,c,d])if(r.error)throw r.error;
    S.drills=a.data;S.drillAns=b.data;S.drillStatus=d.data||[];
    S.drillModels={};for(const m of c.data)S.drillModels[m.drill_id]=m;
  },
  async reviews(){const {data,error}=await S.sb.from("reviews").select("*");if(error)throw error;
    const items={};for(const r of data)items[r.term_id]={box:r.box,due:r.due,last:r.last};S.review={exists:true,items}}
};
const TABLE_TO_LOADER={terms:"terms",sessions:"sessions",session_versions:"sessions",taglines:"taglines",comments:"comments",favorites:"favorites",daily_sentences:"daily",drills:"drills",drill_answers:"drills",reviews:"reviews"};
async function reload(which){
  const keys=which?[which]:Object.keys(loaders);
  await Promise.all(keys.map(k=>loaders[k]().catch(()=>{})));
  render();
}

/* ---------- boot ---------- */
render();
(async()=>{
  const cfg=window.RR_CONFIG;
  if(!cfg||!window.supabase){S.dbState="off";render();return}
  if(/type=recovery/.test(location.hash))S.authMode="newpw";
  S.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  let started=false;
  async function start(session){
    if(!session){S.dbState="login";$("#me").innerHTML="";render();return}
    if(started)return;started=true;
    S.uid=(session.user.email||"").toLowerCase();
    const {data:members}=await S.sb.from("members").select("email,display_name");
    for(const m of members||[])S.names[m.email]={name:m.display_name};
    if(!(members||[]).some(m=>m.email===S.uid)){S.dbState="notmember";render();return}
    $("#me").innerHTML='<span>'+esc(S.names[S.uid].name)+'</span><button class="link" data-action="logout">로그아웃</button>';
    await reload();S.dbState="ready";render();
    const ch=S.sb.channel("rr");
    for(const t of Object.keys(TABLE_TO_LOADER))ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>reload(TABLE_TO_LOADER[t]));
    ch.subscribe();
  }
  const {data}=await S.sb.auth.getSession();
  await start(data.session);
  S.sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"){S.authMode="newpw";render();return}if(ev==="SIGNED_IN")start(session);else if(ev==="SIGNED_OUT")location.reload()});
})();
})();
</script>
